<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comp Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0d;--surface:#161414;--surface2:#1e1c1c;--surface3:#242121;
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.18);
  --text:#f0efef;--muted:rgba(255,255,255,0.42);--muted2:rgba(255,255,255,0.22);
  --accent:#c8f542;--font:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px;background:var(--surface);border-bottom:0.5px solid var(--border);flex-shrink:0}
.topbar h1{font-size:14px;font-weight:600;flex:1}
.topbar-hint{font-size:11px;color:var(--muted)}
.btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:opacity 0.2s}
.btn-accent{background:var(--accent);color:#0e0d0d}
.btn-accent:hover{opacity:0.85}
.btn-ghost{background:var(--surface2);color:var(--text);border:0.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-h)}

.shell{display:flex;flex:1;overflow:hidden}

/* LEFT */
.left{flex:1;border-right:0.5px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.left::-webkit-scrollbar{width:4px}
.left::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.era-list{padding:14px}
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.list-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2)}
.btn-sm{padding:5px 12px;border-radius:6px;background:var(--surface2);color:var(--muted);font-size:12px;border:0.5px solid var(--border);cursor:pointer;font-family:var(--font);transition:color 0.15s,border-color 0.15s}
.btn-sm:hover{color:var(--text);border-color:var(--border-h)}

/* ERA ITEM */
.era-item{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.era-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none;transition:background 0.15s}
.era-head:hover{background:rgba(255,255,255,0.03)}
.era-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.era-name-label{flex:1;font-size:13px;font-weight:500}
.era-year-label{font-size:11px;color:var(--muted2)}
.era-arrow{font-size:11px;color:var(--muted2);transition:transform 0.2s;margin-left:4px}
.era-item.open .era-arrow{transform:rotate(90deg)}
.era-body{display:none;padding:14px;border-top:0.5px solid var(--border);background:rgba(0,0,0,0.15)}
.era-item.open .era-body{display:block}

/* COMP ITEM */
.comp-item{background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.06);border-radius:8px;margin-bottom:8px;overflow:hidden}
.comp-head{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;user-select:none;transition:background 0.15s}
.comp-head:hover{background:rgba(255,255,255,0.04)}
.comp-thumb-sm{width:30px;height:30px;border-radius:5px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.comp-name-label{flex:1;font-size:12px;font-weight:500;color:var(--muted)}
.comp-item.open .comp-name-label{color:var(--text)}
.comp-arrow{font-size:10px;color:var(--muted2);transition:transform 0.2s}
.comp-item.open .comp-arrow{transform:rotate(90deg)}
.comp-body{display:none;padding:12px;border-top:0.5px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.1)}
.comp-item.open .comp-body{display:block}

/* FORM */
.field{margin-bottom:10px}
.field>label{display:block;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.field input,.field textarea{width:100%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color 0.15s}
.field input:focus,.field textarea:focus{border-color:rgba(255,255,255,0.28)}
.field textarea{resize:vertical;min-height:60px;line-height:1.6}
.field-hint{font-size:10px;color:var(--muted2);margin-top:3px;line-height:1.5}
.row2{display:flex;gap:8px}
.row2 .field{flex:1}

.sec-div{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.sec-div span{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);white-space:nowrap}
.sec-div::after{content:'';flex:1;height:0.5px;background:rgba(255,255,255,0.06)}

/* DROP ZONE */
.dropzone{
  border:1.5px dashed rgba(255,255,255,0.1);
  border-radius:8px;padding:14px 12px;
  text-align:center;cursor:pointer;
  transition:border-color 0.2s,background 0.2s;
  position:relative;
}
.dropzone:hover,.dropzone.drag-over{border-color:rgba(200,245,66,0.4);background:rgba(200,245,66,0.04)}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dropzone-icon{font-size:18px;margin-bottom:4px}
.dropzone-text{font-size:12px;color:var(--muted)}
.dropzone-sub{font-size:10px;color:var(--muted2);margin-top:2px}

/* FILE CHIPS */
.file-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:var(--surface2);border:0.5px solid var(--border);border-radius:999px;font-size:11px;color:var(--muted);max-width:100%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chip-del{background:none;border:none;color:rgba(255,80,80,0.5);cursor:pointer;font-size:13px;padding:0;line-height:1;flex-shrink:0}
.chip-del:hover{color:#ff6b6b}
.chip-drag{cursor:grab;opacity:0.5;font-size:10px}

/* TRACKLIST */
.track-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.track-item{background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.06);border-radius:6px;padding:7px 9px}
.track-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.track-num{font-size:10px;color:var(--muted2);width:16px;text-align:right;flex-shrink:0}
.track-title-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:12px;outline:none}
.track-title-input::placeholder{color:var(--muted2)}
.track-del{background:none;border:none;color:rgba(255,80,80,0.4);font-size:14px;cursor:pointer;flex-shrink:0;line-height:1}
.track-del:hover{color:#ff6b6b}
.track-subs{display:flex;gap:5px}
.track-subs input{flex:1;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);border-radius:5px;padding:4px 7px;font-size:11px;color:var(--muted);font-family:var(--font);outline:none}
.track-subs input:focus{border-color:rgba(255,255,255,0.2);color:var(--text)}

/* BADGES */
.badge-row{display:flex;flex-wrap:wrap;gap:5px}
.badge-check{display:none}
.badge-label{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid rgba(255,255,255,0.1);color:var(--muted);transition:opacity 0.15s;user-select:none}
.badge-check:checked+.badge-label{opacity:1}
.badge-check:not(:checked)+.badge-label{opacity:0.35}
.badge-highlight{color:#fbbf24;border-color:rgba(251,191,36,0.3)}
.badge-unique{color:#a78bfa;border-color:rgba(167,139,250,0.3)}
.badge-overhaul{color:#60a5fa;border-color:rgba(96,165,250,0.3)}
.badge-renovation{color:#c483f5;border-color:rgba(196,131,245,0.3)}
.badge-vanilla{color:#f6d860;border-color:rgba(251,191,36,0.25)}
.badge-extension{color:#f87171;border-color:rgba(248,113,113,0.3)}
.badge-remix{color:#34d399;border-color:rgba(52,211,153,0.3)}
.badge-honorable{color:var(--muted);border-color:rgba(255,255,255,0.12)}

.btn-del-era{background:rgba(255,60,60,0.08);border:0.5px solid rgba(255,60,60,0.15);color:#ff6b6b;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:var(--font)}
.btn-del-era:hover{background:rgba(255,60,60,0.15)}

/* CREDITS DROP */
.credits-parsed{background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.07);border-radius:7px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.8;margin-top:6px;white-space:pre-wrap}

/* RIGHT */
.right{width:260px;flex-shrink:0;overflow-y:auto;padding:16px;background:#0a0909}
.right::-webkit-scrollbar{width:4px}
.right::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.preview-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
.json-box{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px;font-size:10px;font-family:monospace;color:rgba(255,255,255,0.4);line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:calc(100vh - 100px);overflow-y:auto}
</style>
</head>
<body>

<div class="topbar">
  <h1>Comp Builder</h1>
  <span class="topbar-hint">Fill in → Export JSON → send to Yusuf</span>
  <label class="btn btn-ghost" style="cursor:pointer">
    Import JSON <input type="file" accept=".json" style="display:none" onchange="importJSON(this)">
  </label>
  <button class="btn btn-accent" onclick="exportJSON()">↓ Export JSON</button>
</div>

<div class="shell">
  <div class="left">
    <div class="era-list">
      <div class="list-header">
        <span class="list-label">Eras</span>
        <button class="btn-sm" onclick="addEra()">+ Add Era</button>
      </div>
      <div id="era-container"></div>
    </div>
  </div>
  <div class="right">
    <p class="preview-label">JSON Preview — updates on Export</p>
    <div class="json-box" id="json-box">Press "Export JSON" to preview...</div>
  </div>
</div>

<script>
const eraCover   = id             => `tracker/${id}/${id}.jpg`;
const compCover  = (eraId, compId)=> `tracker/${eraId}/${compId}/${compId}.jpg`;
const artworkSrc = (eraId, compId, filename) =>
  `tracker/${eraId}/${compId}/${filename}`.split('/').map(encodeURIComponent).join('/');

let DATA = { eras: [] };

const BADGES = [
  { id:'highlight',  label:'⭐ Highlight',     cls:'badge-highlight' },
  { id:'unique',     label:'✨ Unique',         cls:'badge-unique' },
  { id:'overhaul',   label:'Overhaul',          cls:'badge-overhaul' },
  { id:'renovation', label:'Renovation',        cls:'badge-renovation' },
  { id:'vanilla',    label:'Vanilla-style',     cls:'badge-vanilla' },
  { id:'extension',  label:'Extension',         cls:'badge-extension' },
  { id:'remix',      label:'Remix',             cls:'badge-remix' },
  { id:'honorable',  label:'Honorable Mention', cls:'badge-honorable' },
];

function uid() { return '_'+Math.random().toString(36).slice(2,8); }

// ── ERA ──────────────────────────────────────────────────────────────────────
function addEra() {
  DATA.eras.push({ _id:uid(), id:'', name:'', year:'', cover:'', description:'', comps:[] });
  renderAll();
  setTimeout(() => { const els = document.querySelectorAll('.era-item'); els[els.length-1]?.classList.add('open'); }, 30);
}

function removeEra(id) {
  if (!confirm('Remove this era?')) return;
  DATA.eras = DATA.eras.filter(e => e._id !== id);
  renderAll();
}

function moveEra(id, d) {
  const i = DATA.eras.findIndex(e => e._id === id);
  const j = i+d;
  if (j < 0 || j >= DATA.eras.length) return;
  [DATA.eras[i], DATA.eras[j]] = [DATA.eras[j], DATA.eras[i]];
  renderAll();
}

// ── COMP ─────────────────────────────────────────────────────────────────────
function addComp(eraId) {
  const era = DATA.eras.find(e => e._id === eraId);
  if (!era) return;
  era.comps.push({ _id:uid(), id:'', name:'', editor:'', year:'', badges:[], samply:'', art:[], description:'', info:'', tracklist:[], credits:{ editors:[], raw:'' } });
  renderAll();
  setTimeout(() => {
    const era_el = document.getElementById(`era-${eraId}`);
    const comps = era_el?.querySelectorAll('.comp-item');
    comps?.[comps.length-1]?.classList.add('open');
  }, 30);
}

function removeComp(eraId, compId) {
  const era = DATA.eras.find(e => e._id === eraId);
  if (!era) return;
  era.comps = era.comps.filter(c => c._id !== compId);
  renderAll();
}

// ── TRACK ────────────────────────────────────────────────────────────────────
function addTrack(eraId, compId) {
  const comp = getComp(eraId, compId);
  if (!comp) return;
  comp.tracklist.push({ _id:uid(), title:'', feat:'', editors:'' });
  renderTrackList(eraId, compId);
}

function removeTrack(eraId, compId, tid) {
  const comp = getComp(eraId, compId);
  if (!comp) return;
  comp.tracklist = comp.tracklist.filter(t => t._id !== tid);
  renderTrackList(eraId, compId);
}

function getComp(eraId, compId) {
  return DATA.eras.find(e => e._id === eraId)?.comps.find(c => c._id === compId);
}

// ── ART FILES ────────────────────────────────────────────────────────────────
function handleArtDrop(e, eraId, compId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const files = [...(e.dataTransfer?.files || e.target?.files || [])];
  if (!files.length) return;
  const comp = getComp(eraId, compId);
  if (!comp) return;
  files.forEach(f => { if (!comp.art.includes(f.name)) comp.art.push(f.name); });
  renderArtChips(eraId, compId);
}

function removeArtFile(eraId, compId, name) {
  const comp = getComp(eraId, compId);
  if (!comp) return;
  comp.art = comp.art.filter(f => f !== name);
  renderArtChips(eraId, compId);
}

function renderArtChips(eraId, compId) {
  const comp = getComp(eraId, compId);
  const container = document.getElementById(`art-chips-${compId}`);
  if (!container || !comp) return;
  container.innerHTML = comp.art.map(f => `
    <div class="chip">
      <span>${f}</span>
      <button class="chip-del" onclick="removeArtFile('${eraId}','${compId}','${f}')">×</button>
    </div>`).join('');
}

// ── CREDITS DROP ─────────────────────────────────────────────────────────────
function handleInfoDrop(e, eraId, compId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const files = [...(e.dataTransfer?.files || e.target?.files || [])];
  if (!files.length) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const comp = getComp(eraId, compId);
    if (!comp) return;
    comp.info = (comp.info ? comp.info + '\n\n' : '') + ev.target.result;
    const el = document.getElementById(`info-text-${compId}`);
    if (el) el.value = comp.info;
  };
  reader.readAsText(files[0]);
}

function setInfo(eraId, compId, val) {
  const comp = getComp(eraId, compId);
  if (comp) comp.info = val;
}

function renderTrackList(eraId, compId) {
  const comp = getComp(eraId, compId);
  const container = document.getElementById(`tracks-${compId}`);
  if (!container || !comp) return;
  container.innerHTML = '';
  comp.tracklist.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-item';
    el.innerHTML = `
      <div class="track-top">
        <span class="track-num">${i+1}</span>
        <input class="track-title-input" value="${esc(t.title)}" placeholder="Track title" oninput="updateTrack('${eraId}','${compId}','${t._id}','title',this.value)">
        <button class="track-del" onclick="removeTrack('${eraId}','${compId}','${t._id}')">×</button>
      </div>
      <div class="track-subs">
        <input value="${esc(t.feat)}" placeholder="feat. ..." oninput="updateTrack('${eraId}','${compId}','${t._id}','feat',this.value)">
        <input value="${esc(t.editors)}" placeholder="Editors" oninput="updateTrack('${eraId}','${compId}','${t._id}','editors',this.value)">
      </div>`;
    container.appendChild(el);
  });
}

function updateTrack(eraId, compId, tid, key, val) {
  const comp = getComp(eraId, compId);
  const t = comp?.tracklist.find(t => t._id === tid);
  if (t) t[key] = val;
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderAll() {
  const container = document.getElementById('era-container');
  const openEras = new Set([...document.querySelectorAll('.era-item.open')].map(el => el.id.replace('era-','')));
  const openComps = new Set([...document.querySelectorAll('.comp-item.open')].map(el => el.id.replace('comp-','')));
  container.innerHTML = '';

  DATA.eras.forEach((era, ei) => {
    const el = document.createElement('div');
    el.className = 'era-item' + (openEras.has(era._id) ? ' open' : '');
    el.id = `era-${era._id}`;
    el.innerHTML = `
      <div class="era-head" onclick="this.parentElement.classList.toggle('open')">
        <img class="era-thumb" src="${era.id ? eraCover(era.id) : ''}" onerror="this.style.opacity=0.15" alt="">
        <span class="era-name-label">${era.name||'Untitled Era'}</span>
        <span class="era-year-label">${era.year||''}</span>
        <button onclick="event.stopPropagation();moveEra('${era._id}',-1)" class="btn-sm" style="padding:2px 7px">↑</button>
        <button onclick="event.stopPropagation();moveEra('${era._id}',1)" class="btn-sm" style="padding:2px 7px">↓</button>
        <span class="era-arrow">›</span>
      </div>
      <div class="era-body">
        <div class="row2">
          <div class="field">
            <label>Era Name</label>
            <input value="${esc(era.name)}" placeholder="Yandhi [V1]" oninput="setEra('${era._id}','name',this.value)">
          </div>
          <div class="field">
            <label>Era ID <span style="font-weight:400;text-transform:none;letter-spacing:0">(slug)</span></label>
            <input value="${esc(era.id)}" placeholder="yandhi-v1" oninput="setEra('${era._id}','id',this.value)">
            <p class="field-hint" id="era-cover-hint-${era._id}" style="font-family:monospace;color:var(--muted2)">${era.id ? 'tracker/'+era.id+'/'+era.id+'.jpg' : '— erst Era-ID eingeben'}</p>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Year</label>
            <input value="${esc(era.year)}" placeholder="2018" oninput="setEra('${era._id}','year',this.value)">
          </div>

        </div>
        <div class="field">
          <label>Description</label>
          <textarea placeholder="Era description..." oninput="setEra('${era._id}','description',this.value)">${esc(era.description)}</textarea>
        </div>

        <div class="sec-div"><span>Comps</span></div>
        <div id="comps-${era._id}"></div>
        <button class="btn-sm" style="width:100%;text-align:center;margin-top:4px" onclick="addComp('${era._id}')">+ Add Comp</button>
        <div style="margin-top:10px">
          <button class="btn-del-era" onclick="removeEra('${era._id}')">Remove Era</button>
        </div>
      </div>`;
    container.appendChild(el);

    // Render comps
    const compsContainer = document.getElementById(`comps-${era._id}`);
    era.comps.forEach(comp => {
      const cel = document.createElement('div');
      cel.className = 'comp-item' + (openComps.has(comp._id) ? ' open' : '');
      cel.id = `comp-${comp._id}`;
      cel.innerHTML = `
        <div class="comp-head" onclick="this.parentElement.classList.toggle('open')">
          <img class="comp-thumb-sm" src="${era.id && comp.id ? compCover(era.id, comp.id) : ''}" onerror="this.style.opacity=0.15" alt="">
          <span class="comp-name-label">${comp.name||'Untitled Comp'}</span>
          <span class="comp-arrow">›</span>
        </div>
        <div class="comp-body">
          <div class="row2">
            <div class="field">
              <label>Comp Name</label>
              <input value="${esc(comp.name)}" placeholder="Yandhi" oninput="setComp('${era._id}','${comp._id}','name',this.value)">
            </div>
            <div class="field">
              <label>Comp ID <span style="font-weight:400;text-transform:none;letter-spacing:0">(slug)</span></label>
              <input value="${esc(comp.id)}" placeholder="yandhi-narcissist" oninput="setComp('${era._id}','${comp._id}','id',this.value)">
              <p class="field-hint" id="cover-hint-${comp._id}" style="font-family:monospace;color:var(--muted2)">${era.id && comp.id ? 'tracker/'+era.id+'/'+comp.id+'/'+comp.id+'.jpg' : '— erst Era-ID und Comp-ID eingeben'}</p>
            </div>
          </div>
          <div class="field">
            <label>Editor</label>
            <input value="${esc(comp.editor)}" placeholder="The NARCISSIST Team" oninput="setComp('${era._id}','${comp._id}','editor',this.value)">
          </div>
          <div class="row2">
            <div class="field">
              <label>Year (comp released)</label>
              <input value="${esc(comp.year)}" placeholder="2024" oninput="setComp('${era._id}','${comp._id}','year',this.value)">
            </div>
            <div class="field">
              <label>Samply Link</label>
              <input value="${esc(comp.samply)}" placeholder="https://samply.app/p/..." oninput="setComp('${era._id}','${comp._id}','samply',this.value)">
            </div>
          </div>
          <div class="field">
            <label>Description</label>
            <textarea placeholder="Comp description..." oninput="setComp('${era._id}','${comp._id}','description',this.value)">${esc(comp.description)}</textarea>
          </div>
          <div class="field">
            <label>Badges</label>
            <div class="badge-row">${BADGES.map(b => `
              <input type="checkbox" class="badge-check" id="b-${comp._id}-${b.id}" ${comp.badges.includes(b.id)?'checked':''} onchange="toggleBadge('${era._id}','${comp._id}','${b.id}',this.checked)">
              <label for="b-${comp._id}-${b.id}" class="badge-label ${b.cls}">${b.label}</label>`).join('')}
            </div>
          </div>

          <div class="sec-div"><span>Artwork</span></div>
          <div class="dropzone" id="art-dz-${comp._id}"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleArtDrop(event,'${era._id}','${comp._id}')">
            <input type="file" multiple accept="image/*,.png,.jpg,.jpeg,.webp" onchange="handleArtDrop(event,'${era._id}','${comp._id}')">
            <div class="dropzone-icon">🖼</div>
            <p class="dropzone-text">Drop artwork files or click to browse</p>
            <p class="dropzone-sub">Only filenames are saved — files stay on your machine</p>
          </div>
          <div class="file-chips" id="art-chips-${comp._id}"></div>

          <div class="sec-div"><span>Tracklist &amp; Credits</span></div>
          <div class="dropzone"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleInfoDrop(event,'${era._id}','${comp._id}')">
            <input type="file" accept=".txt,.md" onchange="handleInfoDrop(event,'${era._id}','${comp._id}')">
            <div class="dropzone-icon">📄</div>
            <p class="dropzone-text">Drop any file with tracklist / credits info</p>
            <p class="dropzone-sub">Raw text — Yusuf parses it</p>
          </div>
          <div class="field" style="margin-top:8px">
            <label>Or paste / type info here</label>
            <textarea id="info-text-${comp._id}" style="min-height:120px;font-size:11px;font-family:monospace" placeholder="Paste tracklist, credits, or any notes here..." oninput="setInfo('${era._id}','${comp._id}',this.value)">${esc(comp.info||'')}</textarea>
          </div>

          <div style="margin-top:10px">
            <button class="btn-del-era" onclick="removeComp('${era._id}','${comp._id}')">Remove Comp</button>
          </div>
        </div>`;
      compsContainer.appendChild(cel);
      renderArtChips(era._id, comp._id);
    });
  });
}

function setEra(id, key, val) {
  const era = DATA.eras.find(e => e._id === id);
  if (!era) return;
  era[key] = val;
  const head = document.querySelector(`#era-${id} .era-name-label`);
  if (key === 'name' && head) head.textContent = val || 'Untitled Era';
  const year = document.querySelector(`#era-${id} .era-year-label`);
  if (key === 'year' && year) year.textContent = val;
  if (key === 'id') {
    const hint = document.getElementById(`era-cover-hint-${id}`);
    if (hint) hint.textContent = val ? `tracker/${val}/${val}.jpg` : '— erst Era-ID eingeben';
    const img = document.querySelector(`#era-${id} .era-thumb`);
    if (img && val) { img.src = eraCover(val); img.style.opacity = 1; }
  }
}

function setComp(eraId, compId, key, val) {
  const comp = getComp(eraId, compId);
  if (!comp) return;
  comp[key] = val;
  const label = document.querySelector(`#comp-${compId} .comp-name-label`);
  if (key === 'name' && label) label.textContent = val || 'Untitled Comp';
  if (key === 'id' || key === 'cover') {
    const era = DATA.eras.find(e => e._id === eraId);
    const hint = document.getElementById(`cover-hint-${compId}`);
    if (hint && era?.id && comp.id) hint.textContent = `tracker/${era.id}/${comp.id}/${comp.id}.jpg`;
    const img = document.querySelector(`#comp-${compId} .comp-thumb-sm`);
    if (img && era?.id && comp.id) { img.src = compCover(era.id, comp.id); img.style.opacity = 1; }
  }
}

function setCredits(eraId, compId, val) {
  const comp = getComp(eraId, compId);
  if (comp) comp.credits.editors = val.split(',').map(s=>s.trim()).filter(Boolean);
}

function toggleBadge(eraId, compId, bid, checked) {
  const comp = getComp(eraId, compId);
  if (!comp) return;
  if (checked) { if (!comp.badges.includes(bid)) comp.badges.push(bid); }
  else comp.badges = comp.badges.filter(b => b !== bid);
}

// ── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function buildOutput() {
  return DATA.eras.map(era => ({
    id: era.id || era.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),
    name: era.name, year: era.year, description: era.description,
    comps: era.comps.map(comp => {
      const eraId = era.id || era.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
      const compId = comp.id || comp.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
      return {
        id: compId, name: comp.name, editor: comp.editor,
        year: comp.year, badges: comp.badges, samply: comp.samply,
        art: comp.art.map(f => `tracker/${eraId}/${compId}/${f}`),
        description: comp.description,
        info: comp.info || null,
        tracklist: comp.tracklist.map((t,i) => ({ n:i+1, title:t.title, feat:t.feat||null, editors:t.editors||null })),
        credits: { editors: comp.credits.editors }
      };
    })
  }));
}

function exportJSON() {
  const data = buildOutput();
  const json = JSON.stringify(data, null, 2);
  document.getElementById('json-box').textContent = json;
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'comps-data.json'; a.click();
}

function importJSON(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const arr = JSON.parse(e.target.result);
      DATA.eras = arr.map(era => ({
        _id:uid(), id:era.id, name:era.name, year:era.year, description:era.description,
        comps:(era.comps||[]).map(c => ({
          _id:uid(), id:c.id, name:c.name, cover:c.cover, editor:c.editor, year:c.year||'',
          badges:c.badges||[], samply:c.samply||'',
          art:(c.art||[]).map(f => f.split('/').pop()),
          description:c.description||'',
          info:c.info||'',
          tracklist:(c.tracklist||[]).map(t => ({_id:uid(),title:t.title,feat:t.feat||'',editors:t.editors||''})),
          credits:{editors:(c.credits?.editors||[]),raw:''}
        }))
      }));
      renderAll();
    } catch { alert('Invalid JSON'); }
  };
  r.readAsText(file); input.value='';
}

renderAll();
</script>
