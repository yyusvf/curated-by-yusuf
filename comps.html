<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanye Comps — Ye Curated</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="assets/fonts/inter.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0d;--surface:#161414;--surface2:#1e1c1c;
  --border:rgba(255,255,255,0.06);--border-h:rgba(255,255,255,0.13);
  --text:#f0efef;--muted:rgba(255,255,255,0.42);--muted2:rgba(255,255,255,0.22);
  --accent:#c8f542;--font:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:80px;overflow-x:hidden}

/* ── TOPBAR ── */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;height:52px;background:rgba(14,13,13,0.92);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);gap:12px}
.topbar-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;transition:color 0.2s;justify-self:start}
.topbar-back:hover{color:var(--text)}
.topbar-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{display:none}
.topbar-sub{display:none}

/* ── SEARCH ── */
.search-wrap{position:relative;width:100%;max-width:380px;justify-self:center}
.search-input{background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);border-radius:999px;padding:8px 32px 8px 34px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;width:100%;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s}
.search-input:focus{border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(255,255,255,0.05)}
.search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;opacity:0.38}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:rgba(255,255,255,0.7);font-size:10px;cursor:pointer;padding:0;line-height:1;display:none;font-family:var(--font);align-items:center;justify-content:center}
.search-clear.show{display:flex}

/* ── SEARCH RESULTS ── */
.search-results{display:none;padding:24px 32px 0}
.search-results.active{display:block}
.search-count{font-size:12px;color:var(--muted);margin-bottom:20px}
.search-hit{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;background:var(--surface);border:0.5px solid var(--border);cursor:pointer;transition:border-color 0.15s,transform 0.15s;margin-bottom:8px}
.search-hit:hover{border-color:var(--border-h);transform:translateY(-1px)}
.search-hit-cover{width:44px;height:44px;border-radius:7px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.search-hit-body{flex:1;min-width:0}
.search-hit-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-hit-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-hit-tag{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;flex-shrink:0}
.tag-comp{background:rgba(200,245,66,0.1);color:var(--accent);border:0.5px solid rgba(200,245,66,0.2)}
.tag-era{background:rgba(96,165,250,0.1);color:#60a5fa;border:0.5px solid rgba(96,165,250,0.2)}
.tag-track{background:rgba(167,139,250,0.1);color:#a78bfa;border:0.5px solid rgba(167,139,250,0.2)}
.tag-editor{background:rgba(52,211,153,0.1);color:#34d399;border:0.5px solid rgba(52,211,153,0.2)}
.search-empty{text-align:center;padding:48px 0;color:var(--muted);font-size:14px}

@media(max-width:720px){
  .topbar{padding:0 14px;gap:8px}
  .search-wrap{max-width:none}
  .search-results{padding:16px 14px 0}
}

/* ── PAGE ── */
.page{max-width:1000px;margin:0 auto;padding:48px 32px 0}
.page-heading{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:52px}

/* ── ERA SECTION ── */
.era-section{margin-bottom:64px}

.era-header{
  display:flex;align-items:center;gap:20px;
  padding-bottom:24px;
  border-bottom:0.5px solid var(--border);
  margin-bottom:24px;
}
.era-cover{
  width:120px;height:120px;border-radius:12px;
  object-fit:cover;flex-shrink:0;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
}
.era-info{flex:1;min-width:0}
.era-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.era-name{font-size:22px;font-weight:700;letter-spacing:-0.4px;margin-bottom:10px}
.era-desc-wrap{position:relative;max-width:620px}
.era-desc{
  font-size:13px;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  transition:opacity 0.2s ease;
}
.era-desc-full{
  position:absolute;top:0;left:0;right:0;
  font-size:13px;color:var(--muted);line-height:1.6;
  z-index:10;pointer-events:none;
  opacity:0;transition:opacity 0.3s ease;
}
.era-header:hover .era-desc{opacity:0}
.era-header:hover .era-desc-full{opacity:1}
.era-header{overflow:visible}
.era-header:hover .era-desc-full{opacity:1}

/* ── COMP GRID ── */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px;align-items:start}

.comp-card{cursor:pointer;transition:transform 0.25s cubic-bezier(.16,1,.3,1);min-width:0}
.comp-card:hover{transform:translateY(-3px)}
.comp-card-cover-wrap{width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface2);box-shadow:0 4px 16px rgba(0,0,0,0.35);transition:box-shadow 0.25s;flex-shrink:0}
.comp-card:hover .comp-card-cover-wrap{box-shadow:0 10px 32px rgba(0,0,0,0.55)}
.comp-card-cover{
  width:100%;aspect-ratio:1/1;border-radius:10px;
  object-fit:cover;display:block;
  background:var(--surface2);
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
  transition:box-shadow 0.25s;
  min-height:0;
}
.comp-card:hover .comp-card-cover-wrap{width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface2);box-shadow:0 4px 16px rgba(0,0,0,0.35);transition:box-shadow 0.25s;flex-shrink:0}
.comp-card:hover .comp-card-cover-wrap{box-shadow:0 10px 32px rgba(0,0,0,0.55)}
.comp-card-cover{box-shadow:0 10px 32px rgba(0,0,0,0.55)}
.comp-card-name{font-size:13px;font-weight:600;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card-editor{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card-badges{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

/* ── BADGES ── */
.badge{font-size:10px;font-weight:600;letter-spacing:0.03em;padding:2px 8px;border-radius:999px}
.badge-highlight{background:rgba(251,191,36,0.15);color:#fbbf24;border:0.5px solid rgba(251,191,36,0.25)}
.badge-unique{background:rgba(167,139,250,0.15);color:#a78bfa;border:0.5px solid rgba(167,139,250,0.25)}
.badge-overhaul{background:rgba(96,165,250,0.15);color:#60a5fa;border:0.5px solid rgba(96,165,250,0.25)}
.badge-vanilla{background:rgba(251,191,36,0.1);color:#f6d860;border:0.5px solid rgba(251,191,36,0.2)}
.badge-remix{background:rgba(52,211,153,0.15);color:#34d399;border:0.5px solid rgba(52,211,153,0.25)}
.badge-renovation{background:rgba(196,131,245,0.15);color:#c483f5;border:0.5px solid rgba(196,131,245,0.25)}
.badge-extension{background:rgba(248,113,113,0.15);color:#f87171;border:0.5px solid rgba(248,113,113,0.25)}
.badge-honorable{background:rgba(255,255,255,0.06);color:var(--muted);border:0.5px solid rgba(255,255,255,0.1)}

/* ── COMP MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}

.cmodal{
  background:var(--surface);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:16px;width:100%;max-width:680px;
  max-height:88vh;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  animation:mIn 0.3s cubic-bezier(.16,1,.3,1) both;
}

/* EDIT TRIGGER */
.edit-trigger{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--surface2);border:0.5px solid var(--border);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:400;transition:background 0.2s,color 0.2s,right 0.3s;font-family:var(--font)}
.edit-trigger:hover{background:var(--surface);color:var(--text)}
.edit-trigger.active{background:var(--accent);color:#0a0a0a;border-color:transparent;right:404px}
@media(max-width:768px){.edit-trigger{display:none!important}}

/* EDIT PANEL */
.edit-panel{position:fixed;top:0;right:0;width:380px;height:100vh;background:#111;border-left:0.5px solid rgba(255,255,255,0.1);z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.3s cubic-bezier(.16,1,.3,1)}
.edit-panel.open{transform:translateX(0)}
.ep-head{padding:20px;border-bottom:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ep-head h2{font-size:15px;font-weight:600}
.ep-save{background:var(--accent);color:#0a0a0a;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.ep-save:hover{opacity:0.85}
.ep-body{flex:1;overflow-y:auto;padding:16px}
.ep-body::-webkit-scrollbar{width:4px}
.ep-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.ep-section{margin-bottom:8px;border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
.ep-section-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;transition:background 0.15s}
.ep-section-head:hover{background:rgba(255,255,255,0.03)}
.ep-section-title{flex:1;font-size:13px;font-weight:500}
.ep-section-type{font-size:10px;color:var(--muted);background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:999px}
.ep-section-body{display:none;padding:12px 14px;border-top:0.5px solid rgba(255,255,255,0.06)}
.ep-section.open .ep-section-body{display:block}
.ep-arrow{font-size:12px;color:var(--muted);transition:transform 0.2s}
.ep-section.open .ep-arrow{transform:rotate(90deg)}
.ep-vis-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;background:rgba(52,211,153,0.1);border:0.5px solid rgba(52,211,153,0.25);color:#34d399;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:background 0.15s}
.ep-vis-btn.hidden{background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.25);color:#f87171}
.ep-vis-btn:hover{opacity:0.8}

/* HIDDEN ERAS */
.era-section.era-hidden{display:none}
.edit-panel-open .era-section.era-hidden{display:block;opacity:0.4;pointer-events:none}

/* PW MODAL */
.pw-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;align-items:center;justify-content:center}
.pw-modal.open{display:flex}
.pw-box{background:#161414;border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:28px;width:300px;position:relative}
.pw-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
.pw-input{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;margin-bottom:10px}
.pw-input:focus{border-color:rgba(255,255,255,0.3)}
.pw-submit{width:100%;padding:10px;border-radius:8px;background:var(--accent);color:#0a0a0a;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}
.pw-err{font-size:12px;color:#ff6b6b;margin-top:8px;display:none}
.pw-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;font-family:var(--font)}
@keyframes mIn{from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

.cm-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);border:none;color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;font-family:var(--font);transition:background 0.15s}
.cm-close:hover{background:rgba(0,0,0,0.8);color:#fff}

/* hero */
/* ── APPLE MUSIC STYLE MODAL ── */
.cmodal{
  background:rgba(18,16,16,0.96);
  border:0.5px solid rgba(255,255,255,0.08);
  border-radius:18px;width:100%;max-width:780px;
  max-height:88vh;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  animation:mIn 0.35s cubic-bezier(.16,1,.3,1) both;
}

/* blurred cover bg */
.cm-bg-blur{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(80px) brightness(0.18) saturate(1.8);
  transform:scale(1.2);
  pointer-events:none;
}

/* topbar */


/* hero */
.cm-hero-block{
  display:flex;align-items:flex-end;gap:24px;
  padding:32px 28px 24px;
  flex-shrink:0;position:relative;z-index:1;
}
.cm-cover-large{
  width:148px;height:148px;
  border-radius:12px;object-fit:cover;
  flex-shrink:0;background:rgba(255,255,255,0.06);
  box-shadow:0 20px 60px rgba(0,0,0,0.7),0 4px 16px rgba(0,0,0,0.4);
  cursor:pointer;
  transition:transform 0.35s cubic-bezier(.16,1,.3,1),box-shadow 0.35s;
}
.cm-cover-large:hover{transform:scale(1.05);box-shadow:0 28px 70px rgba(0,0,0,0.8),0 6px 20px rgba(0,0,0,0.5)}
.cm-hero-info{flex:1;min-width:0;padding-bottom:4px}
.cm-name{font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;margin-bottom:4px}
.cm-editor{font-size:14px;color:rgba(255,255,255,0.55);margin-bottom:12px}
.cm-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.cm-play{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 24px;border-radius:999px;
  background:var(--accent);color:#0e0d0d;
  font-size:13px;font-weight:700;text-decoration:none;font-family:var(--font);
  transition:opacity 0.2s,transform 0.15s;
  box-shadow:0 4px 20px rgba(200,245,66,0.3);
}
.cm-play:hover{opacity:0.88;transform:scale(1.02)}

/* split */
.cm-split{
  display:flex;flex:1;min-height:0;overflow:hidden;
  position:relative;z-index:1;
  border-top:0.5px solid rgba(255,255,255,0.06);
}

/* LEFT */
.cm-left{flex:1;overflow-y:auto;padding:24px 28px}
.cm-left::-webkit-scrollbar{width:4px}
.cm-left::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.cm-section-title{
  font-size:11px;font-weight:700;letter-spacing:0.08em;
  text-transform:uppercase;color:rgba(255,255,255,0.35);
  margin-bottom:12px;margin-top:24px;
}
.cm-section-title:first-child{margin-top:0}

.cm-desc{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.8}

.tracklist{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;transition:background 0.15s;cursor:default}
.trow:hover{background:rgba(255,255,255,0.05)}
.tnum{font-size:12px;color:rgba(255,255,255,0.25);width:20px;flex-shrink:0;text-align:center}
.tinfo{flex:1;min-width:0}
.ttitle{font-size:13px;font-weight:500;color:var(--text)}
.tfeat{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
.teditors{font-size:10px;color:rgba(255,255,255,0.28);margin-top:1px}

/* RIGHT */
.cm-right{
  width:240px;flex-shrink:0;
  border-left:0.5px solid rgba(255,255,255,0.06);
  overflow-y:auto;padding:24px 20px;
}
.cm-right::-webkit-scrollbar{width:4px}
.cm-right::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.cm-detail-row{
  display:flex;flex-direction:column;gap:2px;
  padding:10px 0;border-bottom:0.5px solid rgba(255,255,255,0.06);
  font-size:12px;
}
.cm-detail-row:last-child{border-bottom:none}
.cm-detail-key{color:rgba(255,255,255,0.3);font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.cm-detail-val{color:var(--text);line-height:1.5}

.credits-block{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.9}
.credits-block strong{color:rgba(255,255,255,0.75);font-weight:500}
.credits-text{font-size:11.5px;color:rgba(255,255,255,0.42);line-height:1.8;white-space:pre-wrap;word-break:break-word;font-family:inherit;max-height:320px;overflow-y:auto;scrollbar-width:thin}
.credits-text::-webkit-scrollbar{width:3px}
.credits-text::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* artwork thumbnails */
.cm-main-img{display:none}
.cm-thumb-strip{display:none}
.cm-thumb{display:none}

/* Gallery */
.gallery-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.gallery-overlay.open{display:flex}
.gallery-img{max-width:80vw;max-height:80vh;border-radius:12px;object-fit:contain;user-select:none}
.gallery-btn{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);border:0.5px solid rgba(255,255,255,0.15);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;z-index:5}
.gallery-btn:hover{background:rgba(255,255,255,0.2)}
.gallery-prev{left:20px}
.gallery-next{right:20px}
.gallery-close{position:fixed;top:18px;right:22px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);transition:background 0.15s}
.gallery-close:hover{background:rgba(255,255,255,0.2)}
.gallery-counter{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.5);font-family:var(--font)}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:85vw;max-height:85vh;border-radius:8px}
.lb-close{position:fixed;top:18px;right:22px;font-size:22px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--font)}

@media(max-width:720px){
  .page{padding:24px 14px 0}
  .era-header{flex-direction:column;gap:12px}
  .era-cover{width:80px;height:80px}
  .comp-grid{grid-template-columns:repeat(2,1fr);gap:12px}

  .overlay{padding:0;overflow:hidden}
  .cmodal{width:100%;max-width:100%;max-height:85vh;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .cm-bg-blur{filter:blur(40px) brightness(0.27) saturate(1.4)}
  .cm-hero-block{padding:14px;gap:12px;align-items:center;flex-shrink:0;box-sizing:border-box;width:100%;overflow:hidden}

<body>

<div class="topbar">
  <a href="index.html" class="topbar-back">
    <svg viewBox="0 0 16 16"><polyline points="10,3 5,8 10,13"/></svg>
    Ye Curated
  </a>
  <span class="topbar-title">Kanye Comps</span>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
    <input class="search-input" id="search-input" type="text" placeholder="Search eras, comps, editors, tracks…" oninput="onSearch(this.value)" onkeydown="if(event.key==='Escape'){clearSearch()}">

<div class="search-results" id="search-results"></div>

<div class="page">
  <h1 class="page-heading">Kanye Comps</h1>

  <div id="eras"></div>
</div>


<!-- PW MODAL -->
<div class="pw-modal" id="pw-modal" onclick="if(event.target===this)this.classList.remove('open')">

    <button class="pw-submit" onclick="checkPw()">Unlock</button>
    <p class="pw-err" id="pw-err">Wrong password</p>
  </div>
</div>

<!-- EDIT TRIGGER -->
<button class="edit-trigger" id="edit-trigger" onclick="onEditTrigger()" title="Edit Mode">✏️</button>

<!-- EDIT PANEL -->
<div class="edit-panel" id="edit-panel">

    <h2>Comps Tracker</h2>
    <button class="pw-close" onclick="togglePanel()">✕</button>

<!-- COMP MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">

  </button>

    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="6,3 11,8 6,13"/></svg>
  </button>
  <p class="gallery-counter" id="gallery-counter"></p>
</div>

<script>
// ─── PATH HELPERS ────────────────────────────────────────────────────────────
const R2 = 'https://pub-36a7e8a33ae24b2fa57770d9344cbd18.r2.dev';
const eraCover   = (id, ext='jpg') => `${R2}/tracker/${id}/${id}.${ext}`;
const compCover  = (eraId, comp) => {
  const id  = typeof comp === 'string' ? comp : comp.id;
  const file= typeof comp === 'object' && comp.cover ? comp.cover : id + '.jpg';
  return `${R2}/tracker/${eraId}/${id}/${file}`.split('/').map((p,i) => i < 3 ? p : encodeURIComponent(p)).join('/');
};
const artworkSrc = (eraId, compId, filename) =>
  `${R2}/tracker/${eraId}/${compId}/${filename}`.split('/').map((p,i) => i < 3 ? p : encodeURIComponent(p)).join('/');



// ─── SUPABASE ────────────────────────────────────────────────────────────────
const SB_URL = 'https://mrqbtjbtidjuxsuolgue.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ycWJ0amJ0aWRqdXhzdW9sZ3VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODgwOTAsImV4cCI6MjA5MzY2NDA5MH0.S6OWEYRY9y51l-DjqiU2h4IXbzfaPPQxb0hoaqfx2XE';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };

// ─── AUTH (only the admin account can write; public reads use the anon key) ────
const ADMIN_EMAIL = 'yusuf.esad.mumcu@gmail.com';
let SB_SESSION = null;
try { SB_SESSION = JSON.parse(localStorage.getItem('sb_session') || 'null'); } catch(e) {}
function saveSession(s) { SB_SESSION = s; if (s) localStorage.setItem('sb_session', JSON.stringify(s)); else localStorage.removeItem('sb_session'); }
async function sbLogin(password) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: ADMIN_EMAIL, password })
  });
  const d = await r.json();
  if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || 'Login failed');
  saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 });
}
async function sbRefresh() {
  if (!SB_SESSION?.refresh_token) return false;
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: SB_SESSION.refresh_token })
  });
  const d = await r.json();
  if (!r.ok || !d.access_token) { saveSession(null); return false; }
  saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 });
  return true;
}
async function sbToken() {
  if (!SB_SESSION) return null;
  if (Date.now() > SB_SESSION.expires_at - 60000) { if (!await sbRefresh()) return null; }
  return SB_SESSION.access_token;
}
async function writeHeaders() {
  const t = await sbToken();
  if (!t) { editUnlocked = false; throw new Error('Session expired — please log in again.'); }
  return { 'apikey': SB_KEY, 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' };
}

async function sbGet(path) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: SB_HEADERS });
  return r.json();
}

async function sbUpsert(table, rows) {
  if (!rows.length) return;
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { ...(await writeHeaders()), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(rows)
  });
  if (!res.ok) {
    const err = await res.text();
    console.error(`sbUpsert(${table}) failed:`, res.status, err);
    throw new Error(`${table}: ${err}`);
  }
}

// ─── EDIT MODE ────────────────────────────────────────────────────────────────
let editUnlocked = !!SB_SESSION;
let _hidden = new Set();
let _initialLoad = true;

async function loadHidden() {
  try {
    const rows = await sbGet('settings?key=eq.hidden_eras&select=value');
    _hidden = new Set(rows[0]?.value || []);
  } catch(e) {
    console.error('loadHidden error:', e);
  }
  _initialLoad = false;
  applyHidden();
}

async function syncHidden() {
  try {
    await sbUpsert('settings', [{ key: 'hidden_eras', value: [..._hidden] }]);
    showSaveIndicator();
  } catch(e) {
    console.error('Sync error:', e);
    let el = document.getElementById('save-indicator');
    if (!el) { el = document.createElement('div'); el.id='save-indicator'; el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);border-radius:999px;padding:8px 18px;font-size:12px;font-weight:600;z-index:500;transition:opacity 0.3s;font-family:var(--font)'; document.body.appendChild(el); }
    el.textContent = '✗ Sync failed';
    el.style.background = '#ff4444';
    el.style.color = '#fff';
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 3000);
  }
}

function showSaveIndicator() {
  if (_initialLoad) return;
  let el = document.getElementById('save-indicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'save-indicator';
    el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);border-radius:999px;padding:8px 18px;font-size:12px;color:#0a0a0a;font-weight:600;z-index:500;transition:opacity 0.3s;font-family:var(--font)';
    document.body.appendChild(el);
  }
  el.textContent = 'Saved ✓';
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 1500);
}

function onEditTrigger() {
  if (!editUnlocked) {
    document.getElementById('pw-modal').classList.add('open');
    setTimeout(() => document.getElementById('pw-input').focus(), 100);
  } else {
    togglePanel();
  }
}

async function checkPw() {
  const input = document.getElementById('pw-input');
  const err = document.getElementById('pw-err');
  const btn = document.querySelector('#pw-modal .pw-submit');
  err.style.display = 'none';
  if (btn) { btn.disabled = true; btn.textContent = 'Logging in…'; }
  try {
    await sbLogin(input.value);
    editUnlocked = true;
    document.getElementById('pw-modal').classList.remove('open');
    input.value = '';
    togglePanel();
  } catch (e) {
    err.textContent = 'Wrong password';
    err.style.display = 'block';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Unlock'; }
  }
}

function togglePanel() {
  const panel = document.getElementById('edit-panel');
  const trigger = document.getElementById('edit-trigger');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    trigger.classList.remove('active');
    document.querySelector('.page').classList.remove('edit-panel-open');
  } else {
    panel.classList.add('open');
    trigger.classList.add('active');
    document.querySelector('.page').classList.add('edit-panel-open');
    buildEraPanel();
  }
}

function buildEraPanel() {
  const body = document.getElementById('ep-body');
  body.innerHTML = '<p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px">Eras</p>';
  ERAS.forEach(era => {
    const isHidden = _hidden.has(era.id);
    const sec = document.createElement('div');
    sec.className = 'ep-section';
    sec.innerHTML = `
      <div class="ep-section-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="ep-section-title">${era.name}</span>
        <span class="ep-section-type">${era.year}</span>
        <span class="ep-arrow">›</span>
      </div>
      <div class="ep-section-body">
        <button class="ep-vis-btn ${isHidden ? 'hidden' : ''}" id="vis-btn-${era.id}" onclick="toggleEraHidden('${era.id}')">
          ${isHidden ? '🙈 Hidden' : '👁 Visible'}
        </button>
        <p style="font-size:11px;color:var(--muted);margin-top:10px">${era.comps.length} comp${era.comps.length!==1?'s':''}</p>
      </div>`;
    body.appendChild(sec);
  });
}

function toggleEraHidden(eraId) {
  if (_hidden.has(eraId)) _hidden.delete(eraId);
  else _hidden.add(eraId);
  applyHidden();
  buildEraPanel();
  syncHidden();
}

function applyHidden() {
  ERAS.forEach(era => {
    const sec = document.getElementById(`era-sec-${era.id}`);
    if (sec) sec.classList.toggle('era-hidden', _hidden.has(era.id));
  });
}

// ─── DATA ────────────────────────────────────────────────────────────────────
let ERAS = [];

const BADGE_MAP = {
  highlight:  ['badge-highlight','⭐ Highlight'],
  unique:     ['badge-unique','✨ Most Unique'],
  overhaul:   ['badge-overhaul','Overhaul'],
  vanilla:    ['badge-vanilla','Vanilla-style'],
  remix:      ['badge-remix','Remix'],
  renovation: ['badge-renovation','Renovation'],
  extension:  ['badge-extension','Extension'],
  honorable:  ['badge-honorable','Honorable Mention'],
};
function renderBadges(list=[]) {
  return list.map(b => {
    const [cls,label] = BADGE_MAP[b]||['badge-honorable',b];
    return `<span class="badge ${cls}">${label}</span>`;
  }).join('');
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderEras() {
  const erasEl = document.getElementById('eras');
  erasEl.innerHTML = '';
  ERAS.forEach(era => {
    const sec = document.createElement('div');
    sec.className = 'era-section';
    sec.id = `era-sec-${era.id}`;
    sec.innerHTML = `
      <div class="era-header">
        <img class="era-cover" src="${eraCover(era.id)}" alt="${era.name}" onerror="this.style.opacity=0.2">
        <div class="era-info">
          <p class="era-label">Era · ${era.year}</p>
          <h2 class="era-name">${era.name}</h2>
          <div class="era-desc-wrap">
            <p class="era-desc">${era.description}</p>
            <p class="era-desc-full">${era.description}</p>
          </div>
        </div>
      </div>
      <div class="comp-grid" id="grid-${era.id}"></div>`;
    erasEl.appendChild(sec);
    const grid = document.getElementById(`grid-${era.id}`);
    era.comps.forEach(comp => {
      const card = document.createElement('div');
      card.className = 'comp-card';
      card.innerHTML = `
        <div class="comp-card-cover-wrap"><img class="comp-card-cover" src="${compCover(era.id, comp)}" alt="${comp.name}" onerror="this.style.opacity=0.15"></div>
        <p class="comp-card-name">${comp.name}</p>
        <p class="comp-card-editor">${comp.editor}</p>
        <div class="comp-card-badges">${renderBadges(comp.badges)}</div>`;
      card.onclick = () => openComp(era.id, comp.id);
      grid.appendChild(card);
    });
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('comps-data-built.json');
    ERAS = await res.json();
  } catch(e) {
    console.error('Failed to load comps-data-built.json:', e);
  }
  renderEras();
  loadHidden();
})();

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openComp(eraId, compId) {
  const era = ERAS.find(e => e.id === eraId);
  const comp = era?.comps.find(c => c.id === compId);
  if (!comp) return;

  // Blurred background
  document.getElementById('cm-bg-blur').style.backgroundImage = `url('${compCover(era.id, comp)}')`;

  // Topbar
  

  // Hero
  const galleryImages = [
    compCover(era.id, comp),
    ...(comp.art || []).map(f => artworkSrc(era.id, comp.id, f))
  ];
  const coverEl = document.getElementById('cm-cover-large');
  coverEl.src = compCover(era.id, comp);
  coverEl.style.cursor = 'pointer';
  coverEl.onclick = () => openGallery(galleryImages, 0);
  document.getElementById('cm-name').textContent = comp.name;
  document.getElementById('cm-editor').textContent = comp.editor;
  document.getElementById('cm-badges').innerHTML = renderBadges(comp.badges);
  document.getElementById('cm-play-wrap').innerHTML = comp.samply
    ? `<a href="${comp.samply}" target="_blank" class="cm-play">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play on Samply
      </a>` : '';

  // Left: description + tracklist + artwork thumbs
  const left = document.getElementById('cm-left');
  const artFiles = comp.art || [];
  left.innerHTML = `
    <p class="cm-section-title">About</p>
    <p class="cm-desc">${comp.description}</p>

    ${artFiles.length ? `
    <div class="cm-thumb-strip">
      ${artFiles.map((f,i) => `<img class="cm-thumb${i===0?' active':''}" src="${f}" alt="" onclick="openLightbox('${f}');document.querySelectorAll('.cm-thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')" onerror="this.style.opacity=0.15">`).join('')}
    </div>` : ''}

    ${comp.tracklist?.length ? `
    <p class="cm-section-title">Tracklist · ${comp.tracklist.length} tracks</p>
    <div class="tracklist">
      ${comp.tracklist.map(t => `
        <div class="trow">
          <span class="tnum">${t.n}</span>
          <div class="tinfo">
            <p class="ttitle">${t.title}</p>
            ${t.feat ? `<p class="tfeat">feat. ${t.feat}</p>` : ''}
            ${t.editors ? `<p class="teditors">${t.editors}</p>` : ''}
          </div>
        </div>`).join('')}
    </div>` : ''}`;

  // Right: details + credits
  const right = document.getElementById('cm-right');
  right.innerHTML = `
    <p class="cm-section-title">Details</p>
    <div>
      <div class="cm-detail-row"><p class="cm-detail-key">Editor</p><p class="cm-detail-val">${comp.editor}</p></div>
      <div class="cm-detail-row"><p class="cm-detail-key">Era</p><p class="cm-detail-val">${era.name}</p></div>
      ${comp.tracklist?.length ? `<div class="cm-detail-row"><p class="cm-detail-key">Tracks</p><p class="cm-detail-val">${comp.tracklist.length}</p></div>` : ''}
    </div>

    ${comp.credits?.editors?.length ? `
    <p class="cm-section-title">Editors</p>
    <div class="credits-block">
      ${comp.credits.editors.map(e => `<span>${e.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`).join('<br>')}
      ${comp.credits.thanks ? `<br><br><em style="color:rgba(255,255,255,0.3)">${comp.credits.thanks.replace(/&/g,'&amp;')}</em>` : ''}
    </div>` : ''}

    ${comp.notes ? `
    <p class="cm-section-title" style="margin-top:${comp.credits?.editors?.length ? '20px' : '0'}">Notes</p>
    <pre class="credits-text">${comp.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>` : ''}`;

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ─── GALLERY ─────────────────────────────────────────────────────────────────
let _gallery = [], _galleryIdx = 0;

function openGallery(images, startIdx) {
  _gallery = images;
  _galleryIdx = startIdx;
  setGalleryImg();
  document.getElementById('gallery').classList.add('open');
}
function closeGallery() {
  document.getElementById('gallery').classList.remove('open');
}
function galleryNav(dir) {
  _galleryIdx = (_galleryIdx + dir + _gallery.length) % _gallery.length;
  setGalleryImg(true);
}
function setGalleryImg(animate) {
  const img = document.getElementById('gallery-img');
  img.src = _gallery[_galleryIdx];
  document.getElementById('gallery-counter').textContent = `${_galleryIdx + 1} / ${_gallery.length}`;
  document.querySelectorAll('.gallery-btn').forEach(b => b.style.display = _gallery.length > 1 ? '' : 'none');
}

// Also keep openLightbox as alias for art thumbs in case
function openLightbox(src) { openGallery([src], 0); }

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function onSearch(q) {
  const clear = document.getElementById('search-clear');
  const resultsEl = document.getElementById('search-results');
  const page = document.querySelector('.page');
  q = q.trim();

  clear.classList.toggle('show', q.length > 0);

  if (!q) {
    resultsEl.classList.remove('active');
    resultsEl.innerHTML = '';
    page.style.display = '';
    return;
  }

  page.style.display = 'none';
  resultsEl.classList.add('active');

  const ql = q.toLowerCase();
  const hits = [];

  for (const era of ERAS) {
    if (_hidden.has(era.id)) continue;

    // Era match
    if (era.name.toLowerCase().includes(ql)) {
      hits.push({ type: 'era', era, comp: null, track: null,
        label: era.name, sub: `${era.comps.length} comps · ${era.year}`,
        cover: eraCover(era.id) });
    }

    for (const comp of era.comps) {
      const compMatches = comp.name.toLowerCase().includes(ql);
      const editorMatches = (comp.editor||'').toLowerCase().includes(ql);
      const trackHits = (comp.tracklist||[]).filter(t =>
        t.title.toLowerCase().includes(ql) ||
        (t.feat||'').toLowerCase().includes(ql) ||
        (t.editors||'').toLowerCase().includes(ql)
      );

      if (compMatches) {
        hits.push({ type: 'comp', era, comp, track: null,
          label: comp.name, sub: `${era.name} · ${comp.editor}`,
          cover: compCover(era.id, comp) });
      } else if (editorMatches) {
        hits.push({ type: 'editor', era, comp, track: null,
          label: comp.editor, sub: `${comp.name} · ${era.name}`,
          cover: compCover(era.id, comp) });
      }

      for (const t of trackHits) {
        hits.push({ type: 'track', era, comp, track: t,
          label: t.title, sub: `${comp.name} · ${era.name}${t.feat ? ' · feat. '+t.feat : ''}`,
          cover: compCover(era.id, comp) });
      }
    }
  }

  if (!hits.length) {
    resultsEl.innerHTML = `<div class="search-empty">No results for "<strong>${q}</strong>"</div>`;
    return;
  }

  const TAG = { comp: ['tag-comp','Comp'], era: ['tag-era','Era'], track: ['tag-track','Track'], editor: ['tag-editor','Editor'] };
  resultsEl.innerHTML = `<p class="search-count">${hits.length} result${hits.length!==1?'s':''} for "<strong>${q}</strong>"</p>` +
    hits.map((h,i) => {
      const [tagCls, tagLabel] = TAG[h.type];
      return `<div class="search-hit" data-hit="${i}">
        <img class="search-hit-cover" src="${h.cover}" alt="" onerror="this.style.opacity=0.15">
        <div class="search-hit-body">
          <p class="search-hit-name">${h.label}</p>
          <p class="search-hit-sub">${h.sub}</p>
        </div>
        <span class="search-hit-tag ${tagCls}">${tagLabel}</span>
      </div>`;
    }).join('');

  resultsEl.querySelectorAll('.search-hit').forEach((el, i) => {
    el.onclick = () => {
      const h = hits[i];
      if (h.type === 'era') {
        clearSearch();
        document.getElementById(`era-sec-${h.era.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        openComp(h.era.id, h.comp.id);
      }
    };
  });
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  onSearch('');
  input.focus();
}

document.addEventListener('keydown', e => {
  const g = document.getElementById('gallery');
  if (g.classList.contains('open')) {
    if (e.key === 'ArrowLeft') galleryNav(-1);
    else if (e.key === 'ArrowRight') galleryNav(1);
    else if (e.key === 'Escape') closeGallery();
  } else if (e.key === 'Escape') closeModal();
});

</script>
</body>
</html>
