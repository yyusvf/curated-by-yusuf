<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanye Comps — Curated by Yusuf</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0d;--surface:#161414;--surface2:#1e1c1c;
  --border:rgba(255,255,255,0.06);--border-h:rgba(255,255,255,0.13);
  --text:#f0efef;--muted:rgba(255,255,255,0.42);--muted2:rgba(255,255,255,0.22);
  --accent:#c8f542;--font:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:80px}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:16px;padding:0 32px;height:52px;background:rgba(14,13,13,0.92);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.topbar-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;transition:color 0.2s}
.topbar-back:hover{color:var(--text)}
.topbar-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-title{font-size:14px;font-weight:600}
.topbar-sub{font-size:12px;color:var(--muted);margin-left:auto}

/* ── PAGE ── */
.page{max-width:1000px;margin:0 auto;padding:48px 32px 0}
.page-heading{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:52px}

/* ── ERA SECTION ── */
.era-section{margin-bottom:64px}

.era-header{
  display:flex;align-items:center;gap:20px;
  padding-bottom:24px;
  border-bottom:0.5px solid var(--border);
  margin-bottom:24px;
}
.era-cover{
  width:120px;height:120px;border-radius:12px;
  object-fit:cover;flex-shrink:0;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
}
.era-info{flex:1;min-width:0}
.era-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.era-name{font-size:22px;font-weight:700;letter-spacing:-0.4px;margin-bottom:10px}
.era-desc-wrap{position:relative;max-width:620px}
.era-desc{
  font-size:13px;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  transition:opacity 0.2s ease;
}
.era-desc-full{
  position:absolute;top:0;left:0;right:0;
  font-size:13px;color:var(--muted);line-height:1.6;
  z-index:10;pointer-events:none;
  opacity:0;transition:opacity 0.3s ease;
}
.era-header:hover .era-desc{opacity:0}
.era-header:hover .era-desc-full{opacity:1}
.era-header{overflow:visible}
.era-header:hover .era-desc-full{opacity:1}

/* ── COMP GRID ── */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px}

.comp-card{cursor:pointer;transition:transform 0.25s cubic-bezier(.16,1,.3,1)}
.comp-card:hover{transform:translateY(-3px)}
.comp-card-cover{
  width:100%;aspect-ratio:1/1;border-radius:10px;
  object-fit:cover;display:block;
  background:var(--surface2);
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
  transition:box-shadow 0.25s;
}
.comp-card:hover .comp-card-cover{box-shadow:0 10px 32px rgba(0,0,0,0.55)}
.comp-card-name{font-size:13px;font-weight:600;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card-editor{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card-badges{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

/* ── BADGES ── */
.badge{font-size:10px;font-weight:600;letter-spacing:0.03em;padding:2px 8px;border-radius:999px}
.badge-highlight{background:rgba(251,191,36,0.15);color:#fbbf24;border:0.5px solid rgba(251,191,36,0.25)}
.badge-unique{background:rgba(167,139,250,0.15);color:#a78bfa;border:0.5px solid rgba(167,139,250,0.25)}
.badge-overhaul{background:rgba(96,165,250,0.15);color:#60a5fa;border:0.5px solid rgba(96,165,250,0.25)}
.badge-vanilla{background:rgba(251,191,36,0.1);color:#f6d860;border:0.5px solid rgba(251,191,36,0.2)}
.badge-remix{background:rgba(52,211,153,0.15);color:#34d399;border:0.5px solid rgba(52,211,153,0.25)}
.badge-renovation{background:rgba(196,131,245,0.15);color:#c483f5;border:0.5px solid rgba(196,131,245,0.25)}
.badge-extension{background:rgba(248,113,113,0.15);color:#f87171;border:0.5px solid rgba(248,113,113,0.25)}
.badge-honorable{background:rgba(255,255,255,0.06);color:var(--muted);border:0.5px solid rgba(255,255,255,0.1)}

/* ── COMP MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}

.cmodal{
  background:var(--surface);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:16px;width:100%;max-width:680px;
  max-height:88vh;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  animation:mIn 0.3s cubic-bezier(.16,1,.3,1) both;
}
@keyframes mIn{from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

.cm-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);border:none;color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;font-family:var(--font);transition:background 0.15s}
.cm-close:hover{background:rgba(0,0,0,0.8);color:#fff}

/* hero */
/* ── APPLE MUSIC STYLE MODAL ── */
.cmodal{
  background:rgba(18,16,16,0.96);
  border:0.5px solid rgba(255,255,255,0.08);
  border-radius:18px;width:100%;max-width:780px;
  max-height:88vh;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  animation:mIn 0.35s cubic-bezier(.16,1,.3,1) both;
}

/* blurred cover bg */
.cm-bg-blur{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(80px) brightness(0.18) saturate(1.8);
  transform:scale(1.2);
  pointer-events:none;
}

/* topbar */


/* hero */
.cm-hero-block{
  display:flex;align-items:flex-end;gap:24px;
  padding:32px 28px 24px;
  flex-shrink:0;position:relative;z-index:1;
}
.cm-cover-large{
  width:148px;height:148px;
  border-radius:12px;object-fit:cover;
  flex-shrink:0;background:rgba(255,255,255,0.06);
  box-shadow:0 20px 60px rgba(0,0,0,0.7),0 4px 16px rgba(0,0,0,0.4);
  cursor:pointer;
  transition:transform 0.35s cubic-bezier(.16,1,.3,1),box-shadow 0.35s;
}
.cm-cover-large:hover{transform:scale(1.05);box-shadow:0 28px 70px rgba(0,0,0,0.8),0 6px 20px rgba(0,0,0,0.5)}
.cm-hero-info{flex:1;min-width:0;padding-bottom:4px}
.cm-name{font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;margin-bottom:4px}
.cm-editor{font-size:14px;color:rgba(255,255,255,0.55);margin-bottom:12px}
.cm-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.cm-play{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 24px;border-radius:999px;
  background:var(--accent);color:#0e0d0d;
  font-size:13px;font-weight:700;text-decoration:none;font-family:var(--font);
  transition:opacity 0.2s,transform 0.15s;
  box-shadow:0 4px 20px rgba(200,245,66,0.3);
}
.cm-play:hover{opacity:0.88;transform:scale(1.02)}

/* split */
.cm-split{
  display:flex;flex:1;min-height:0;overflow:hidden;
  position:relative;z-index:1;
  border-top:0.5px solid rgba(255,255,255,0.06);
}

/* LEFT */
.cm-left{flex:1;overflow-y:auto;padding:24px 28px}
.cm-left::-webkit-scrollbar{width:4px}
.cm-left::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.cm-section-title{
  font-size:11px;font-weight:700;letter-spacing:0.08em;
  text-transform:uppercase;color:rgba(255,255,255,0.35);
  margin-bottom:12px;margin-top:24px;
}
.cm-section-title:first-child{margin-top:0}

.cm-desc{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.8}

.tracklist{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;transition:background 0.15s;cursor:default}
.trow:hover{background:rgba(255,255,255,0.05)}
.tnum{font-size:12px;color:rgba(255,255,255,0.25);width:20px;flex-shrink:0;text-align:center}
.tinfo{flex:1;min-width:0}
.ttitle{font-size:13px;font-weight:500;color:var(--text)}
.tfeat{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
.teditors{font-size:10px;color:rgba(255,255,255,0.28);margin-top:1px}

/* RIGHT */
.cm-right{
  width:240px;flex-shrink:0;
  border-left:0.5px solid rgba(255,255,255,0.06);
  overflow-y:auto;padding:24px 20px;
}
.cm-right::-webkit-scrollbar{width:4px}
.cm-right::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.cm-detail-row{
  display:flex;flex-direction:column;gap:2px;
  padding:10px 0;border-bottom:0.5px solid rgba(255,255,255,0.06);
  font-size:12px;
}
.cm-detail-row:last-child{border-bottom:none}
.cm-detail-key{color:rgba(255,255,255,0.3);font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.cm-detail-val{color:var(--text);line-height:1.5}

.credits-block{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.9}
.credits-block strong{color:rgba(255,255,255,0.75);font-weight:500}

/* artwork thumbnails */
.cm-main-img{display:none}
.cm-thumb-strip{display:none}
.cm-thumb{display:none}

/* Gallery */
.gallery-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.gallery-overlay.open{display:flex}
.gallery-img{max-width:80vw;max-height:80vh;border-radius:12px;object-fit:contain;user-select:none}
.gallery-btn{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);border:0.5px solid rgba(255,255,255,0.15);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;z-index:5}
.gallery-btn:hover{background:rgba(255,255,255,0.2)}
.gallery-prev{left:20px}
.gallery-next{right:20px}
.gallery-close{position:fixed;top:18px;right:22px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);transition:background 0.15s}
.gallery-close:hover{background:rgba(255,255,255,0.2)}
.gallery-counter{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.5);font-family:var(--font)}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:85vw;max-height:85vh;border-radius:8px}
.lb-close{position:fixed;top:18px;right:22px;font-size:22px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--font)}

@media(max-width:720px){
  .page{padding:32px 16px 0}
  .era-header{flex-direction:column;gap:14px}
  .comp-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .cm-hero-block{flex-direction:column;align-items:flex-start;padding:0 20px 20px}
  .cm-cover-large{width:100px;height:100px}
  .cm-name{font-size:18px}
  .cm-split{flex-direction:column}
  .cm-right{width:100%;border-left:none;border-top:0.5px solid rgba(255,255,255,0.06)}
}
</style>
</head>

const BADGE_MAP = {
  highlight:  ['badge-highlight','⭐ Highlight'],
  unique:     ['badge-unique','✨ Most Unique'],
  overhaul:   ['badge-overhaul','Overhaul'],
  vanilla:    ['badge-vanilla','Vanilla-style'],
  remix:      ['badge-remix','Remix'],
  renovation: ['badge-renovation','Renovation'],
  extension:  ['badge-extension','Extension'],
  honorable:  ['badge-honorable','Honorable Mention'],
};
function renderBadges(list=[]) {
  return list.map(b => {
    const [cls,label] = BADGE_MAP[b]||['badge-honorable',b];
    return `<span class="badge ${cls}">${label}</span>`;
  }).join('');
}

// ─── RENDER ERAS ─────────────────────────────────────────────────────────────
const erasEl = document.getElementById('eras');
ERAS.forEach(era => {
  const sec = document.createElement('div');
  sec.className = 'era-section';
  sec.innerHTML = `
    <div class="era-header">
      <img class="era-cover" src="${era.cover}" alt="${era.name}" onerror="this.style.opacity=0.2">
      <div class="era-info">
        <p class="era-label">Era · ${era.year}</p>
        <h2 class="era-name">${era.name}</h2>
        <div class="era-desc-wrap">
          <p class="era-desc">${era.description}</p>
          <p class="era-desc-full">${era.description}</p>
        </div>
      </div>
    </div>
    <div class="comp-grid" id="grid-${era.id}"></div>`;
  erasEl.appendChild(sec);

  const grid = document.getElementById(`grid-${era.id}`);
  era.comps.forEach(comp => {
    const card = document.createElement('div');
    card.className = 'comp-card';
    card.innerHTML = `
      <img class="comp-card-cover" src="${comp.cover}" alt="${comp.name}" onerror="this.style.opacity=0.15">
      <p class="comp-card-name">${comp.name}</p>
      <p class="comp-card-editor">${comp.editor}</p>
      <div class="comp-card-badges">${renderBadges(comp.badges)}</div>`;
    card.onclick = () => openComp(era.id, comp.id);
    grid.appendChild(card);
  });
});

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openComp(eraId, compId) {
  const era = ERAS.find(e => e.id === eraId);
  const comp = era?.comps.find(c => c.id === compId);
  if (!comp) return;

  // Blurred background
  document.getElementById('cm-bg-blur').style.backgroundImage = `url('${comp.cover}')`;

  // Topbar
  

  // Hero
  const galleryImages = [comp.cover, ...(comp.art || [])].map(f => {
    // encode special chars but keep slashes
    return f.split('/').map(seg => encodeURIComponent(seg)).join('/');
  });
  const coverEl = document.getElementById('cm-cover-large');
  coverEl.src = comp.cover;
  coverEl.style.cursor = 'pointer';
  coverEl.onclick = () => openGallery(galleryImages, 0);
  document.getElementById('cm-name').textContent = comp.name;
  document.getElementById('cm-editor').textContent = comp.editor;
  document.getElementById('cm-badges').innerHTML = renderBadges(comp.badges);
  document.getElementById('cm-play-wrap').innerHTML = comp.samply
    ? `<a href="${comp.samply}" target="_blank" class="cm-play">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play on Samply
      </a>` : '';

  // Left: description + tracklist + artwork thumbs
  const left = document.getElementById('cm-left');
  const artFiles = comp.art || [];
  left.innerHTML = `
    <p class="cm-section-title">About</p>
    <p class="cm-desc">${comp.description}</p>

    ${artFiles.length ? `
    <div class="cm-thumb-strip">
      ${artFiles.map((f,i) => `<img class="cm-thumb${i===0?' active':''}" src="${f}" alt="" onclick="openLightbox('${f}');document.querySelectorAll('.cm-thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')" onerror="this.style.opacity=0.15">`).join('')}
    </div>` : ''}

    ${comp.tracklist?.length ? `
    <p class="cm-section-title">Tracklist · ${comp.tracklist.length} tracks</p>
    <div class="tracklist">
      ${comp.tracklist.map(t => `
        <div class="trow">
          <span class="tnum">${t.n}</span>
          <div class="tinfo">
            <p class="ttitle">${t.title}</p>
            ${t.feat ? `<p class="tfeat">feat. ${t.feat}</p>` : ''}
            ${t.editors ? `<p class="teditors">${t.editors}</p>` : ''}
          </div>
        </div>`).join('')}
    </div>` : ''}`;

  // Right: details + credits
  const right = document.getElementById('cm-right');
  right.innerHTML = `
    <p class="cm-section-title">Details</p>
    <div>
      <div class="cm-detail-row"><p class="cm-detail-key">Editor</p><p class="cm-detail-val">${comp.editor}</p></div>
      <div class="cm-detail-row"><p class="cm-detail-key">Era</p><p class="cm-detail-val">${era.name}</p></div>
      <div class="cm-detail-row"><p class="cm-detail-key">Year</p><p class="cm-detail-val">${comp.year || era.year}</p></div>
      ${comp.tracklist?.length ? `<div class="cm-detail-row"><p class="cm-detail-key">Tracks</p><p class="cm-detail-val">${comp.tracklist.length}</p></div>` : ''}
    </div>

    ${comp.credits ? `
    <p class="cm-section-title">Credits</p>
    <div class="credits-block">
      <strong>Editors</strong><br>${comp.credits.editors.join(', ')}
      ${comp.credits.thanks ? `<br><br>${comp.credits.thanks}` : ''}
    </div>` : ''}`;

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ─── GALLERY ─────────────────────────────────────────────────────────────────
let _gallery = [], _galleryIdx = 0;

function openGallery(images, startIdx) {
  _gallery = images;
  _galleryIdx = startIdx;
  setGalleryImg();
  document.getElementById('gallery').classList.add('open');
}
function closeGallery() {
  document.getElementById('gallery').classList.remove('open');
}
function galleryNav(dir) {
  _galleryIdx = (_galleryIdx + dir + _gallery.length) % _gallery.length;
  setGalleryImg(true);
}
function setGalleryImg(animate) {
  const img = document.getElementById('gallery-img');
  img.src = _gallery[_galleryIdx];
  document.getElementById('gallery-counter').textContent = `${_galleryIdx + 1} / ${_gallery.length}`;
  document.querySelectorAll('.gallery-btn').forEach(b => b.style.display = _gallery.length > 1 ? '' : 'none');
}

// Also keep openLightbox as alias for art thumbs in case
function openLightbox(src) { openGallery([src], 0); }

document.addEventListener('keydown', e => {
  const g = document.getElementById('gallery');
  if (g.classList.contains('open')) {
    if (e.key === 'ArrowLeft') galleryNav(-1);
    else if (e.key === 'ArrowRight') galleryNav(1);
    else if (e.key === 'Escape') closeGallery();
  } else if (e.key === 'Escape') closeModal();
});
</script>
